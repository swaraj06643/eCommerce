{% extends 'store/main.html' %}
{% block content %}
<div class="auth-shell">
    <div class="auth-card">
        <h2>Reset your password</h2>
        <p class="auth-subtitle">Enter the email address on your Avatar account. If it matches, we’ll email a secure reset link.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
        </form>
        <p class="auth-switch"><a href="{% url 'login' %}">Back to login</a></p>
    </div>
</div>
{% endblock %}
