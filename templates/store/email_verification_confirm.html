{% extends 'store/main.html' %}
{% block content %}
<div class="auth-shell">
    <div class="auth-card">
        <h2>Confirm your email</h2>
        <p class="auth-subtitle">Confirm that {{ verification.email }} is your email address.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary btn-block">Verify email address</button>
        </form>
    </div>
</div>
{% endblock %}
