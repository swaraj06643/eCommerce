{% extends 'store/main.html' %}
{% block content %}
<div class="auth-shell">
    <div class="auth-card">
        <h2>Verify your phone</h2>
        <p class="auth-subtitle">If {{ phone }} is linked to an account, an OTP was sent. Enter the code if received; otherwise, check the number or try again later.</p>
        <form method="post">
            {% csrf_token %}
            <label for="phone-otp">One-time password</label>
            <input id="phone-otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{4,8}" maxlength="8" required>
            <button type="submit" class="btn btn-primary btn-block">Verify and login</button>
        </form>
        <form method="post" action="{% url 'phone_login_request' %}" class="auth-resend-form">
            {% csrf_token %}
            <input type="hidden" name="phone" value="{{ phone }}">
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-outline-dark btn-block">Send a new OTP</button>
        </form>
        <p class="auth-switch"><a href="{% url 'login' %}">Back to password login</a></p>
    </div>
</div>
{% endblock %}
